<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartSpend | Personal Finance</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1e293b;
    }
    header {
      background: #172554;
      color: white;
      padding: 22px 30px;
    }
    main {
      max-width: 1000px;
      margin: 35px auto;
      padding: 20px;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 18px;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 3px 12px #0000000b;
    }
    .amount {
      font-size: 26px;
      font-weight: bold;
      color: #2563eb;
    }
    .note {
      color: #64748b;
    }
  </style>
</head>
<body>
  <header>
    <h1>SmartSpend 💰</h1>
    <p>Personal Finance & E-Commerce Planning Suite</p>
  </header>

  <main>
    <h2>Welcome to your dashboard!</h2>
    <p class="note">Your money, your goals, your future.</p>

    <section class="cards">
      <div class="card">
        <h3>Total Income</h3>
        <p class="amount">₹25,000</p>
      </div>
      <div class="card">
        <h3>Total Expenses</h3>
        <p class="amount">₹8,500</p>
      </div>
      <div class="card">
        <h3>Current Balance</h3>
        <p class="amount">₹16,500</p>
      </div>
      <div class="card">
        <h3>Monthly Budget</h3>
        <p class="amount">₹12,000</p>
      </div>
    </section>
  </main>
</body>
</html>
